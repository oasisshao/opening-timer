<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finance Day Breakfast Countdown</title>

<style>

*{
    margin:0;
    padding:0;
   *box-sizing:border-box;
}

body{
  * min-height:100vh;
    font-family:
    "Segoe UI",
    "Microsoft JhengHei",
    sans-serif;

    background:#F7F7F2;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
    position:relative;
}

/* 背景圓形裝飾 */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background:

    radial-gradient(
    circle at 0% 0%,
    #F4E287 0 260px,
    transparent 260px),

    radial-gradient(
    circle at 100% 0%,
    #EFC8DA 0 240px,
    transparent 240px),

    radial-gradient(
    circle at 0% 100%,
    #53C6C4 0 220px,
    transparent 220px),

    radial-gradient(
    circle at 100% 100%,
    #F4E287 0 180px,
    transparent 180px);

    z-index:-1;
}

.container{

    width:min(1200px,94%);

    background:white;

    border-radius:38px;

    padding:45px 50px;

    text-align:center;

    box-shadow:
    0 20px 80px rgba(0,0,0,.08);
}

.title{

    color:#53C6C4;

    font-size:clamp(2rem,4vw,4rem);

    font-weight:800;

    margin-bottom:15px;
}

.activity{

    color:#424242;

    margin-bottom:15px;
}

.activity p{

    font-size:1.05rem;

    font-weight:700;

    margin:12px 0;
}

.info{

    margin-top:15px;

    color:#777;

    line-height:1.7;
}

/* 超大倒數 */

#timer{

    font-size:clamp(10rem,25vw,18rem);

    font-weight:900;

    line-height:.9;

    letter-spacing:-8px;

    color:#53C6C4;

    margin:35px 0;

    font-variant-numeric: tabular-nums;

    text-shadow:
      0 10px 28px rgba(83,198,196,.18);

    transition:.3s;
}

.warning{

    color:#FF6B6B;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }
}

#finished{

    display:none;

    margin-top:10px;

    color:#FF6B6B;

    font-size:2rem;

    font-weight:800;
}

.controls{

    margin-top:15px;

    display:flex;

    justify-content:center;

    gap:20px;

    flex-wrap:wrap;
}

button{

    width:190px;
    height:62px;

    border:none;

    border-radius:20px;

    font-size:1.05rem;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:scale(.98);
}

#startBtn{

    background:#53C6C4;

    color:white;
}

#resetBtn{

    background:#F4E287;

    color:#424242;
}

/* 粗時間軸 */

.slider-wrap{

    margin-top:45px;
}

#slider{

    width:100%;

    appearance:none;

    background:none;
}

#slider::-webkit-slider-runnable-track{

    height:16px;

    border-radius:999px;

    background:
    linear-gradient(
    to right,
    #53C6C4 0%,
    #53C6C4 var(--progress,100%),
    #E5E5E5 var(--progress,100%),
    #E5E5E5 100%);
}

#slider::-webkit-slider-thumb{

    appearance:none;

    width:34px;
    height:34px;

    margin-top:-9px;

    border-radius:50%;

    background:white;

    border:5px solid #53C6C4;

    box-shadow:
    0 4px 12px rgba(0,0,0,.15);

    cursor:pointer;
}

.marks{

    margin-top:14px;

    display:flex;

    justify-content:space-between;

    color:#777;

    font-size:.9rem;
}

/* 音樂按鈕 */

.music{

    margin-top:30px;
}

#musicBtn{

    width:auto;

    padding:0 25px;

    background:#EFC8DA;

    color:#424242;
}

@media(max-width:900px){

    #timer{
        font-size:7rem;
    }

    .container{
        padding:30px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        Finance Day
    </div>

    <div class="activity">

        <p>🥐 Registration & Breakfast | 早餐報到，活力啟航</p>

        <p>🧭 Select Team Lead | 推選隊長，凝聚團隊</p>

        <p>📣 Team Name & Chant | 隊名隊呼・展現風采</p>

        <div class="info">
            Enjoy breakfast & connect with your team<br>
            The event will kick off at 9AM
        </div>

    </div>

    <div id="timer">30:00</div>

    <div id="finished">
        The Event Is Starting!｜活動正式開始！
    </div>

    <div class="controls">

        <button id="startBtn">
            START
        </button>

        <button id="resetBtn">
            RESET
        </button>

    </div>

    <div class="slider-wrap">

        <input
            type="range"
            id="slider"
            min="0"
            max="1800"
            value="1800">

        <div class="marks">
            <span>0</span>
            <span>5</span>
            <span>10</span>
            <span>15</span>
            <span>20</span>
            <span>25</span>
            <span>30</span>
        </div>

    </div>

    <div class="music">

        <button id="musicBtn">
            🎵 PLAY MUSIC
        </button>

    </div>

</div>

<audio id="bgMusic" loop>
    cafe_music.mp3
</audio>

<script>

const DEFAULT_TIME = 1800;

let remaining = DEFAULT_TIME;
let running = false;
let endTime = null;

const timer = document.getElementById("timer");
const slider = document.getElementById("slider");

function format(seconds){

    seconds = Math.max(0,Math.ceil(seconds));

    const m = Math.floor(seconds/60);
    const s = seconds%60;

    return (
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0")
    );
}

function updateDisplay(){

    timer.textContent = format(remaining);

    slider.value = Math.floor(remaining);

    const progress =
    (remaining/1800)*100;

    slider.style.setProperty(
        "--progress",
        progress+"%"
    );

    if(
        remaining <= 300 &&
        remaining > 0
    ){
        timer.classList.add("warning");
    }
    else{
        timer.classList.remove("warning");
    }
}

function tick(){

    if(!running) return;

    remaining =
    Math.max(
        0,
        (endTime - Date.now())/1000
    );

    updateDisplay();

    if(remaining <= 0){

        running = false;

        document
        .getElementById("finished")
        .style.display="block";

        document
        .getElementById("startBtn")
        .innerText="START";
    }
}

setInterval(tick,200);

document
.getElementById("startBtn")
.onclick = function(){

    if(!running){

        endTime =
        Date.now() +
        remaining*1000;

        running = true;

        document
        .getElementById("finished")
        .style.display="none";

        this.innerText = "PAUSE";
    }
    else{

        remaining =
        Math.max(
            0,
            (endTime-Date.now())/1000
        );

        running=false;
        this.innerText="START";
    }
};

document
.getElementById("resetBtn")
.onclick=function(){

    running=false;

    remaining=DEFAULT_TIME;

    updateDisplay();

    document
    .getElementById("finished")
    .style.display="none";

    document
    .getElementById("startBtn")
    .innerText="START";
};

slider.addEventListener("input",function(){

    if(running) return;

    remaining = Number(this.value);

    updateDisplay();
});

/* 音樂 */

const music =
document.getElementById("bgMusic");

music.volume = 0.35;

document
.getElementById("musicBtn")
.onclick = async ()=>{

    try{

        if(music.paused){

            await music.play();

            document
            .getElementById("musicBtn")
            .textContent =
            "🔊 MUSIC ON";
        }
        else{

            music.pause();

            document
            .getElementById("musicBtn")
            .textContent =
            "🎵 PLAY MUSIC";
        }
    }
    catch(e){

        alert(
            "請確認 cafe_music.mp3 已上傳至 GitHub"
        );
    }
};

updateDisplay();

</script>

</body>
</html>
